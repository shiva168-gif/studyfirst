<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaderboard - StudyRank</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navbar.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="navbar"></div>

  <main class="max-w-2xl mx-auto mt-10 px-4">
    <div class="bg-white rounded-xl shadow p-6 text-center">
      <h1 class="text-xl font-semibold text-gray-800 mb-2">🏆 Leaderboard</h1>
      <p class="text-gray-500">Coming in a later step — this will rank users by points.</p>
    </div>
  </main>

  <script>
    (async () => {
      const session = await requireAuth();
      if (session) renderNavbar();
    })();
  </script>
</body>
</html>
